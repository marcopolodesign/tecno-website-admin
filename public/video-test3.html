<!doctype html>
<html><head><meta charset="utf-8"><title>Prueba de video 3</title>
<style>
body{background:#111;color:#fff;font:26px/1.3 sans-serif;margin:24px}
.g{overflow:hidden}.c{float:left;width:440px;margin:0 20px 24px 0}
.box{position:relative;width:440px;height:257px;background:#333}
.box video,.box img{position:absolute;top:0;left:0;width:100%;height:100%}
.n{font-size:34px;font-weight:bold;margin-bottom:6px}
</style></head>
<body>
<div>Prueba 3 — decime qué números muestran el video moviéndose</div>
<div class="g">
<div class="c"><div class="n">1 · simple</div><div class="box"><video data-v muted loop playsinline></video></div></div>
<div class="c"><div class="n">2 · padre con scale(0.9)</div><div style="transform:scale(0.9);transform-origin:top left"><div class="box"><video data-v muted loop playsinline></video></div></div></div>
<div class="c"><div class="n">3 · video con recorte (scale+translate)</div><div class="box" style="overflow:hidden"><video data-v muted loop playsinline style="transform-origin:0 0;transform:scale(1.2,1.2) translate(-5%,-5%);object-fit:cover"></video></div></div>
<div class="c"><div class="n">4 · padre scale + video recorte</div><div style="transform:scale(0.9);transform-origin:top left"><div class="box" style="overflow:hidden"><video data-v muted loop playsinline style="transform-origin:0 0;transform:scale(1.2,1.2) translate(-5%,-5%);object-fit:cover"></video></div></div></div>
<div class="c"><div class="n">5 · padre fixed + scale (como la TV)</div><div style="position:relative;height:257px"><div style="position:absolute;top:0;left:0;transform:scale(0.9);transform-origin:top left"><div class="box"><video data-v muted loop playsinline></video></div></div></div></div>
</div>
<script>
var SRC='https://buntxbgjixlksffbscle.supabase.co/storage/v1/object/public/exercise-media/EJ0247/v1/tv.mp4';
var POS='https://buntxbgjixlksffbscle.supabase.co/storage/v1/object/public/exercise-media/EJ0247/v1/poster.jpg';
var ps=document.querySelectorAll('[data-p]');for(var i=0;i<ps.length;i++)ps[i].src=POS;
var vs=document.querySelectorAll('[data-v]');
// uno por vez cada 4 s para no saturar el decoder, y el último queda andando
var k=0;function sig(){ for(var j=0;j<vs.length;j++){ if(j!==k){ try{vs[j].pause();}catch(e){} } }
  var v=vs[k]; v.muted=true; v.setAttribute('muted',''); if(!v.src) v.src=SRC; try{v.play();}catch(e){}
  k=(k+1)%vs.length; }
sig(); setInterval(sig,4000);
</script>
</body></html>
